[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ot-sentinel-backend"
version = "0.1.0"
description = "OT-Sentinel API and data model"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "packaging>=24,<26",
  "PyJWT[crypto]>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = ["httpx2>=2.7,<3", "mypy>=1.13,<2", "pytest>=9.0.3,<10", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-third-party = ["alembic", "sqlalchemy"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
