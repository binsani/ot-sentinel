apiVersion: v1
kind: Secret
metadata:
  name: ot-sentinel-secrets
  namespace: ot-sentinel
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://USER:PASSWORD@POSTGRES-HOST:5432/ot_sentinel?sslmode=verify-full"
  SENSOR_INGEST_API_KEY: "REPLACE_WITH_RANDOM_SECRET"
  VIEWER_API_KEY: "UNUSED_WHEN_BOOTSTRAP_KEYS_ARE_DISABLED"
  ADMIN_API_KEY: "UNUSED_WHEN_BOOTSTRAP_KEYS_ARE_DISABLED"
  WEBHOOK_SIGNING_SECRET: "REPLACE_WITH_RANDOM_SECRET_AT_LEAST_32_CHARACTERS"
