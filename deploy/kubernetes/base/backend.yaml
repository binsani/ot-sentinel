apiVersion: batch/v1
kind: Job
metadata:
  name: ot-sentinel-migrate
  namespace: ot-sentinel
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ot-sentinel-migrate
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/binsani/ot-sentinel-backend:v0.3.0
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: ot-sentinel-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ot-sentinel-backend
  namespace: ot-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ot-sentinel-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ot-sentinel-backend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/binsani/ot-sentinel-backend:v0.3.0
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: ot-sentinel-config}
            - secretRef: {name: ot-sentinel-secrets}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ot-sentinel
spec:
  selector:
    app.kubernetes.io/name: ot-sentinel-backend
  ports:
    - {name: http, port: 8000, targetPort: http}
