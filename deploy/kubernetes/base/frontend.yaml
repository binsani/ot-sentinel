apiVersion: apps/v1
kind: Deployment
metadata:
  name: ot-sentinel-frontend
  namespace: ot-sentinel
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ot-sentinel-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ot-sentinel-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/binsani/ot-sentinel-frontend:v1.0.0
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ot-sentinel
spec:
  selector:
    app.kubernetes.io/name: ot-sentinel-frontend
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ot-sentinel
  namespace: ot-sentinel
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts: ["ot-sentinel.example.com"]
      secretName: ot-sentinel-ingress-tls
  rules:
    - host: ot-sentinel.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: frontend, port: {name: http}}
