name: Release build
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: release-build-placeholder
      DATABASE_URL: postgresql+psycopg://ot_sentinel:release-build-placeholder@db:5432/ot_sentinel
      SENSOR_INGEST_API_KEY: release-build-placeholder
      VIEWER_API_KEY: release-build-placeholder
      ADMIN_API_KEY: release-build-placeholder
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile sensor --profile feeds config --quiet
      - run: docker compose --profile sensor --profile feeds build
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, sensor]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
