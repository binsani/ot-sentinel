name: Release build
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: release-build-placeholder
      DATABASE_URL: postgresql+psycopg://ot_sentinel:release-build-placeholder@db:5432/ot_sentinel
      SENSOR_INGEST_API_KEY: release-build-placeholder
      VIEWER_API_KEY: release-build-placeholder
      ADMIN_API_KEY: release-build-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python scripts/verify-passive-release.py
      - run: python scripts/verify-release-version.py --expected 1.0.0 --tag "${{ github.ref_name }}"
      - run: docker compose --profile sensor --profile feeds config --quiet
      - run: docker compose --profile sensor --profile feeds build
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend, sensor]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ghcr.io/${{ github.repository }}-${{ matrix.component }}:${{ github.ref_name }}
          provenance: mode=max
          sbom: true
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.12.3
      - run: python scripts/verify-passive-release.py
      - run: python scripts/verify-release-version.py --expected 1.0.0 --tag "${{ github.ref_name }}"
      - run: uv build --directory backend --out-dir ../release-artifacts
      - run: uv build --directory sensor --out-dir ../release-artifacts
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - run: tar -czf release-artifacts/ot-sentinel-frontend-${{ github.ref_name }}.tar.gz -C frontend/dist .
      - working-directory: release-artifacts
        run: sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts/*
  github-release:
    needs: [images, publish, artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: release-artifacts
          path: release-artifacts
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}" release-artifacts/*
          --verify-tag
          --title "OT-Sentinel ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
