name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ot_sentinel_test
          POSTGRES_USER: ot_sentinel
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ot_sentinel -d ot_sentinel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ot_sentinel:ci-postgres-password@localhost:5432/ot_sentinel_test
      INTEGRATION_DATABASE_URL: postgresql+psycopg://ot_sentinel:ci-postgres-password@localhost:5432/ot_sentinel_test
      SENSOR_INGEST_API_KEY: ci-sensor-key-long-enough-for-testing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install uv==0.12.3
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy app
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Backup and isolated restore rehearsal
        shell: pwsh
        env:
          PGPASSWORD: ci-postgres-password
        run: |
          $backupDirectory = Join-Path $env:RUNNER_TEMP 'ot-sentinel-backup'
          $manifestPath = (& ../scripts/backup-postgres.ps1 `
            -DatabaseUrl $env:DATABASE_URL `
            -OutputDirectory $backupDirectory | Select-Object -Last 1)
          & createdb --host localhost --username ot_sentinel ot_sentinel_restore
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create isolated restore database.' }
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $dumpPath = Join-Path $backupDirectory $manifest.dump_file
          & ../scripts/restore-postgres.ps1 `
            -DatabaseUrl 'postgresql://ot_sentinel:ci-postgres-password@localhost:5432/ot_sentinel_restore' `
            -BackupFile $dumpPath `
            -ManifestFile $manifestPath `
            -Confirmation 'RESTORE INTO VERIFIED EMPTY DATABASE'
  sensor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install uv==0.12.3
      - run: uv sync --frozen --extra dev
      - run: uv run python ../scripts/fetch-test-captures.py
      - run: uv run ruff check . ../scripts/fetch-test-captures.py
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
  containers:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_URL: postgresql+psycopg://ot_sentinel:ci-postgres-password@db:5432/ot_sentinel
      SENSOR_INGEST_API_KEY: ci-sensor-key-not-for-production
      VIEWER_API_KEY: ci-viewer-key-not-for-production
      ADMIN_API_KEY: ci-admin-key-not-for-production
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --profile sensor --profile feeds config --quiet
      - run: docker compose --profile sensor --profile feeds build
      - run: kubectl kustomize deploy/kubernetes/base > /dev/null
      - shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content scripts/backup-postgres.ps1 -Raw))
          $null = [scriptblock]::Create((Get-Content scripts/restore-postgres.ps1 -Raw))
          $null = [scriptblock]::Create((Get-Content scripts/collect-audit-evidence.ps1 -Raw))
          $evidenceDirectory = Join-Path $env:RUNNER_TEMP 'audit-evidence-rehearsal'
          $manifestPath = & scripts/collect-audit-evidence.ps1 -OutputDirectory $evidenceDirectory
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          if ($manifest.schema -ne 'ot-sentinel-audit-evidence/v1') { throw 'Unexpected evidence schema.' }
          if ($manifest.worktree_dirty) { throw 'CI evidence collection reported a dirty worktree.' }
          if ($manifest.files.Count -lt 10) { throw 'Audit evidence manifest is incomplete.' }
